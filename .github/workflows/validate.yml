name: Validate project

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts-and-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate Unity asset and scene contracts
        run: python3 Tools/validate_project.py
      - name: Run engine-independent contracts
        run: dotnet run --project Tools/Tests/Runner.Core.Tests.csproj --configuration Release
